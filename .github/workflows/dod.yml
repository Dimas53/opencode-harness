name: DoD Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # dod.sh compares against HEAD~1 and needs history

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run DoD
        run: bash scripts/dod.sh

      - name: Verify DoD/Session-Start sync
        run: bash scripts/check-dod-sync.sh
