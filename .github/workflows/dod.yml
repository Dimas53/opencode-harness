name: DoD Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # dod.sh compares against HEAD~1 and needs history

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run DoD
        run: bash scripts/dod.sh

      # Explicit, even though dod.sh step 6 already calls `make test-quick`:
      # CI must not depend on one gate's internal step to run the test corpus
      # (T-I5 — that indirection is how dod.bats/unadopt.bats stayed unrun).
      - name: Full test suite
        run: make test

      - name: Verify DoD/Session-Start sync
        run: bash scripts/check-dod-sync.sh

      - name: Verify docs-refs (no phantom skills)
        run: bash scripts/check-docs-refs.sh

      - name: Verify propagation (no harness-repo-only paths in delivered files)
        run: bash scripts/check-propagation.sh
