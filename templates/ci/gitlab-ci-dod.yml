# templates/ci/gitlab-ci-dod.yml — T-H5 step 5 (implementation-plan-2 Wave H)
#
# propagation-ok: the templates/ci/ paths in this header name THIS file's
# source in the harness repo — they are provenance, not a path the project is
# expected to open. The file itself is copied out as .gitlab-ci.yml.
#
# Installed as .gitlab-ci.yml, ONLY if you opted in during `adopt`
# (H-DEC-4: optional, asked once, never installed silently). GitLab
# propagation-ok: same as above — provenance, not a path to open.
# equivalent of templates/ci/github-actions-dod.yml — see that file's
# header for why this clones opencode-harness fresh into the runner
# instead of assuming it's already there.
#
# If your project already has its own .gitlab-ci.yml, merge this job in
# manually instead of overwriting the file.
#
# IF THE HARNESS REPO IS PRIVATE, THE CLONE BELOW FAILS.
# An anonymous HTTPS clone only works while the repository is public;
# against a private one git asks for credentials and the job hangs or
# fails on "could not read Username". Dimas53/opencode-harness was public
# when this template was last checked (2026-08-19), so the clone works as
# written. If you fork the harness privately, or it is made private later:
#   1. create a GitHub PAT with read access to the harness repo,
#   2. add it as a masked CI/CD variable HARNESS_REPO_TOKEN
#      (Settings → CI/CD → Variables; masked, and protected only if this
#      job runs on protected branches),
#   3. swap the clone line for:
#      git clone --quiet https://oauth2:$HARNESS_REPO_TOKEN@github.com/Dimas53/opencode-harness.git .opencode-harness-ci
# Keep it a variable — a token written into .gitlab-ci.yml is committed
# history, and the job log prints the URL on failure.
dod:
  stage: test
  image: debian:stable-slim
  variables:
    GIT_DEPTH: "0" # dod.sh compares against HEAD~1 and needs history
  before_script:
    - apt-get update -qq && apt-get install -y -qq git bash >/dev/null
    - git clone --quiet https://github.com/Dimas53/opencode-harness.git .opencode-harness-ci
  script:
    - bash .opencode-harness-ci/scripts/dod.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
