# global/rules/dod.yaml
# Canonical Definition of Done step list — single source of truth for
# step COUNT, ORDER, and IDENTITY (title first word). This is the
# "markdown-only" first version of codegen from the audit's Idea 2
# (F-DEC-1) — deliberately does NOT generate dod.sh (bash-from-yaml is a
# higher-risk, separate step) and does NOT generate step prose either:
# global/AGENTS.md carries the terse trigger list, global/skills/dod/SKILL.md
# carries the elaborated checklist/examples — those are genuinely different
# content by design, not a duplicate, so they stay hand-authored.
#
# What this DOES guarantee: both files must contain exactly these steps,
# in this order, each with a title starting with the listed first word.
# Enforced by `scripts/gen-rules.sh --check` (make check-docs-sync).
#
# Parser note: scripts/gen-rules.sh parses this with awk/grep against the
# exact 4-line-per-step shape below (no real YAML lib — pyyaml isn't
# installed in this environment, see instructions/CHANGELOG.md T3.4-era
# note). Keep every step block in this exact shape if you edit it by hand:
#   - id: <kebab-id>
#     order: <int>
#     first_word: "<Word>"
#     type: <product-judgment|mechanical-gate>

steps:
  - id: session-scan
    order: 1
    first_word: "Session"
    type: product-judgment
  - id: update-docs
    order: 2
    first_word: "Update"
    type: product-judgment
  - id: jsdoc
    order: 3
    first_word: "JSDoc"
    type: product-judgment
  - id: tests
    order: 4
    first_word: "Tests"
    type: product-judgment
  - id: commit-gate
    order: 5
    first_word: "Commit"
    type: mechanical-gate
  - id: safety-check
    order: 6
    first_word: "Safety"
    type: product-judgment
  - id: skill-feedback
    order: 7
    first_word: "Skill"
    type: product-judgment
  - id: cleanup
    order: 8
    first_word: "Cleanup"
    type: product-judgment
  - id: respond
    order: 9
    first_word: "Respond"
    type: product-judgment
